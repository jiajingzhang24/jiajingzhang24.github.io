<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CyberSpace | 炫酷主页</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 粒子背景 -->
    <canvas id="particles"></canvas>

    <!-- 主内容 -->
    <div class="container">
        <h1 class="glitch" data-text="CYBERSPACE">CYBERSPACE</h1>
        <p class="subtitle">✨ 欢迎来到我的炫酷网页 ✨</p>

        <div class="cards">
            <div class="card">
                <h3>🚀 快速</h3>
                <p>毫秒级响应，丝滑体验</p>
            </div>
            <div class="card">
                <h3>🎨 炫酷</h3>
                <p>动态粒子 + 霓虹特效</p>
            </div>
            <div class="card">
                <h3>⚡ 交互</h3>
                <p>点击卡片试试看</p>
            </div>
        </div>

        <button id="magicBtn">点击触发魔法 ✨</button>
        <p id="tip"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
